; OFDMBAT.INI -- modem geometry for OFDMBAT.EXE (TX and RX both read this
; same file; the two sides must agree on every value here or the probe
; sequences they expect disagree). Mirrors ofdm_modem.py's own "Config
; params" list -- see that file's docstring for what each one does.
;
; Defaults below are scaled down for a 25MHz 486DX, not for realism: n_fft=128
; keeps the FFT count and workspace small (~78KB workspace, ~13000 samples /
; 0.6s of probe audio measured on host at these defaults) instead of
; ofdm_modem.py's own n_fft=1024 production geometry. Push these up once real
; on-device timing is measured -- this is a starting point, not a ceiling.
;
; n_probe_syms is deliberately >= 64 (OFDM_ISI_MIN_SYMS in ofdm_probe.h) --
; below that the ISI ratio is withheld as untrustworthy rather than reported
; wrong. This is the PERIODIC block length, not n_meas_syms; swapping the two
; silently disables the ISI measurement with no error at all.

n_fft = 128
cp_ratio = 0.25
freq_lo = 1000
freq_hi = 8000
pilot_spacing = 8
sample_rate = 22050
taper_ms = 2.0
frame_gap_ms = 20.0
n_probe_syms = 64
n_meas_syms = 16
snr_margin_db = 6.0
max_bits_per_bin = 6
sync_period = 32

; TX plays the probe this many times back to back (auto-init DMA loops the
; buffer for free). Arming two independent DOS VMs cannot be synchronised
; tightly -- the testlist gates on RX's "ADC armed" over COM1 and then types a
; command into the other machine -- so repeating turns a race into an overlap.
tx_repeats = 40
